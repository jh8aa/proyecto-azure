<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página en Azure</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            background-image: url('https://images.unsplash.com/photo-1500673922987-e212871fec22?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
            overflow:hidden;
        }

        /* Oscurece ligeramente el fondo */
        body::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.55);
        }

        .container{
            position:relative;
            z-index:1;
            text-align:center;
            color:white;
        }

        .subtitle{
            font-size:1rem;
            letter-spacing:3px;
            text-transform:uppercase;
            margin-bottom:20px;
            opacity:0.8;
        }

        .title{
            font-size:5rem;
            font-weight:900;
            text-transform:uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            margin-bottom:20px;
        }

        .description{
            font-size:1.2rem;
            max-width:700px;
            margin:auto;
            opacity:0.9;
        }

        @media(max-width:768px){
            .title{
                font-size:3rem;
            }

            .description{
                font-size:1rem;
                padding:0 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1 class="title" id="siteName">
            Mi Aplicación Azure
        </h1>

        <p class="description">
            Despliegue exitoso de una aplicación web utilizando Microsoft Azure.
        </p>
    </div>

    <script>
        console.log("Página desplegada correctamente en Azure.");
    </script>

</body>
</html>
